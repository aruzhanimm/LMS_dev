<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - EduSphere LMS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            background: var(--primary-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }
        .profile-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--medium-gray);
            padding-bottom: 0.5rem;
        }
        .profile-tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            color: var(--light-gray);
            border-bottom: 2px solid transparent;
            margin-bottom: -0.5rem;
        }
        .profile-tab.active {
            color: var(--primary-purple);
            border-bottom-color: var(--primary-purple);
        }
        .profile-content {
            display: none;
        }
        .profile-content.active {
            display: block;
        }
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="profile-header">
            <h1>My Profile</h1>
            <div>
                <a href="/add-course" id="professorActionBtn" class="btn" style="display: none;">
                    <i class="fas fa-plus"></i> Add Course
                </a>

                <button id="logoutBtn" class="btn btn-secondary" style="margin-left: 1rem;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <div class="profile-info glass-card">
            <div class="profile-avatar" id="userAvatar">U</div>
            <div>
                <h2 id="userName">Loading...</h2>
                <p id="userEmail">Loading...</p>
            </div>
        </div>

        <div class="profile-tabs">
            <div class="profile-tab active" data-tab="enrolled">My Learning</div>

            <div class="profile-tab professor-only" data-tab="created" style="display: none;">My Courses</div>
            <div class="profile-tab professor-only" data-tab="students" style="display: none;">Students</div>

            <div class="profile-tab" data-tab="settings">Settings</div>
        </div>

        <div id="enrolledContent" class="profile-content active">
            <h3>My Learning</h3>
            <div id="enrolledCourses" class="course-grid"></div>
        </div>

        <div id="createdContent" class="profile-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3>My Created Courses</h3>
                <a href="/add-course" class="btn"><i class="fas fa-plus"></i> Create New Course</a>
            </div>
            <div id="createdCourses" class="course-grid"></div>
        </div>

        <div id="studentsContent" class="profile-content">
            <h3>My Students</h3>
            <div id="studentsList"></div>
        </div>

        <div id="settingsContent" class="profile-content">
            <h3>Account Settings</h3>
            <p>Role management and password settings coming soon.</p>
        </div>
    </main>

    <script>
        // Глобальная переменная для роли пользователя
        let currentUserRole = 'student';

        // Load user data
        async function loadUserData() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();
                const user = data.user;

                if (user) {
                    currentUserRole = user.role || 'student';

                    document.getElementById('userName').textContent = user.username;

                    // Красивый бейдж роли
                    const roleLabel = currentUserRole === 'professor'
                        ? ' <span style="background:var(--primary-purple); font-size:0.7em; padding:2px 6px; border-radius:4px;">Professor</span>'
                        : ' <span style="background:gray; font-size:0.7em; padding:2px 6px; border-radius:4px;">Student</span>';

                    document.getElementById('userEmail').innerHTML = user.email + roleLabel;
                    document.getElementById('userAvatar').textContent = user.username.charAt(0).toUpperCase();

                    // --- САМОЕ ГЛАВНОЕ: ЛОГИКА ОТОБРАЖЕНИЯ ---
                    if (currentUserRole === 'professor') {
                        // 1. Показываем кнопку Add Course в хедере
                        const btn = document.getElementById('professorActionBtn');
                        if (btn) btn.style.display = 'inline-flex';

                        // 2. Показываем табы профессора
                        document.querySelectorAll('.professor-only').forEach(el => {
                            el.style.display = 'block';
                        });

                        // Опционально: Сразу переключаем на "My Courses" для удобства
                        // document.querySelector('[data-tab="created"]').click();
                    }
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }

        // --- ЛОГИКА ТАБОВ ---
        // Вешаем обработчик на родителя (делегирование событий), чтобы работало надежно
        document.querySelector('.profile-tabs').addEventListener('click', (e) => {
            if (e.target.classList.contains('profile-tab')) {
                const tab = e.target;
                const tabId = tab.dataset.tab;

                // Убираем активные классы
                document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.profile-content').forEach(c => c.classList.remove('active'));

                // Добавляем активный класс
                tab.classList.add('active');
                const content = document.getElementById(tabId + 'Content');
                if (content) content.classList.add('active');

                // Грузим данные
                if (tabId === 'enrolled') loadEnrolledCourses();
                else if (tabId === 'created') loadCreatedCourses();
                else if (tabId === 'students') loadStudents();
            }
        });

        // Load enrolled courses
        async function loadEnrolledCourses() {
            try {
                const response = await fetch('/api/auth/my-courses');
                const data = await response.json();
                const container = document.getElementById('enrolledCourses');

                if (data.courses && data.courses.length > 0) {
                    container.innerHTML = data.courses.map(course => `
                        <div class="course-card glass-card hover-scale">
                            <div class="card-img-top">
                                <img src="${course.image}" alt="${course.title}" style="height: 150px; object-fit: cover;">
                            </div>
                            <div class="card-body">
                                <div class="card-meta">
                                    <span class="category">${course.category}</span>
                                    <span class="rating"><i class="fas fa-star"></i> ${course.rating}</span>
                                </div>
                                <h3 class="course-title">${course.title}</h3>
                                <p class="instructor">By ${course.instructor}</p>
                                <div class="progress-bar" style="margin: 10px 0;">
                                    <div style="background: var(--medium-gray); height: 5px; border-radius: 3px;">
                                        <div style="background: var(--primary-purple); width: ${course.progress || 0}%; height: 100%; border-radius: 3px;"></div>
                                    </div>
                                    <small>Progress: ${course.progress || 0}%</small>
                                </div>
                                <div class="card-footer">
                                    <a href="/item/${course._id}" class="btn-sm" style="width:100%; text-align:center;">Continue Learning</a>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p>You have not enrolled in any courses yet.</p>';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Load created courses (Только для профессора)
        async function loadCreatedCourses() {
            try {
                const response = await fetch('/api/auth/created-courses');
                const data = await response.json();
                const container = document.getElementById('createdCourses');

                if (data.courses && data.courses.length > 0) {
                    container.innerHTML = data.courses.map(course => `
                        <div class="course-card glass-card hover-scale">
                            <div class="card-img-top">
                                <img src="${course.image}" alt="${course.title}" style="height: 150px; object-fit: cover; width: 100%;">
                            </div>
                            <div class="card-body">
                                <h3 class="course-title">${course.title}</h3>
                                <div class="card-footer" style="margin-top: auto;">
                                    <span class="price">$${course.price}</span>
                                    <div style="display: flex; gap: 5px;">
                                        <button class="btn-sm btn-secondary" onclick="editCourse('${course._id}')"><i class="fas fa-edit"></i></button>
                                        <button class="btn-sm" style="background-color: #ef4444; color: white; border: none;" onclick="deleteCourse('${course._id}')"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p>No courses created yet.</p>';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Load Students (Только для профессора)
        async function loadStudents() {
            try {
                const response = await fetch('/api/auth/my-students');
                if(!response.ok) throw new Error('Failed');
                const data = await response.json();
                const container = document.getElementById('studentsList');

                if (data.students && data.students.length > 0) {
                    container.innerHTML = `
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr>
                                        <th style="text-align: left; padding: 10px; border-bottom: 1px solid #444;">Student</th>
                                        <th style="text-align: left; padding: 10px; border-bottom: 1px solid #444;">Course</th>
                                        <th style="text-align: left; padding: 10px; border-bottom: 1px solid #444;">Progress</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.students.map(s => `
                                        <tr>
                                            <td style="padding: 10px; border-bottom: 1px solid #333;">${s.username}<br><small style="color:#aaa">${s.email}</small></td>
                                            <td style="padding: 10px; border-bottom: 1px solid #333;">${s.courseTitle}</td>
                                            <td style="padding: 10px; border-bottom: 1px solid #333;">${s.progress}%</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>`;
                } else {
                    container.innerHTML = '<p>No students yet.</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('studentsList').innerHTML = '<p>Access denied or error loading students.</p>';
            }
        }

        // Функция удаления
        async function deleteCourse(courseId) {
            if (!confirm('Delete this course?')) return;
            try {
                const response = await fetch(`/api/courses/${courseId}`, { method: 'DELETE' });
                if (response.ok) {
                    loadCreatedCourses();
                } else {
                    alert('Failed to delete');
                }
            } catch (e) { console.error(e); }
        }

        // Переход на редактирование
        window.editCourse = function(courseId) {
            window.location.href = `/add-course?edit=${courseId}`;
        };

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        });

        // Запуск при загрузке
        loadUserData();
        loadEnrolledCourses();
    </script>
</body>
</html>
