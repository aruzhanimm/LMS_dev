<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - EduSphere LMS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .profile-info {
            display: flex;
            align-items: flex-start; /* Изменил на start для лучшего вида с био */
            gap: 1.5rem;
            margin-bottom: 2rem;
            padding: 2rem;
        }
        /* Стили для аватарки-буквы */
        .profile-avatar-placeholder {
            width: 100px;
            height: 100px;
            background: var(--primary-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
        }
        /* Стили для аватарки-картинки */
        .profile-avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-purple);
            display: none; /* Скрыто по умолчанию */
            flex-shrink: 0;
        }

        .profile-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--medium-gray);
            padding-bottom: 0.5rem;
        }
        .profile-tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            color: var(--light-gray);
            border-bottom: 2px solid transparent;
            margin-bottom: -0.5rem;
        }
        .profile-tab.active {
            color: var(--primary-purple);
            border-bottom-color: var(--primary-purple);
        }
        .profile-content {
            display: none;
        }
        .profile-content.active {
            display: block;
        }
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            max-width: 500px;
            margin: 5% auto;
            padding: 2rem;
            position: relative;
        }
        .close-modal {
            position: absolute;
            right: 20px;
            top: 20px;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--light-gray);
            transition: 0.3s;
        }
        .close-modal:hover { color: white; }
    </style>
</head>
<body>

    <main class="container">
        <div class="profile-header">
            <h1>My Profile</h1>
            <div>
                <a href="/add-course" id="professorActionBtn" class="btn" style="display: none;">
                    <i class="fas fa-plus"></i> Add Course
                </a>

                <button id="logoutBtn" class="btn btn-secondary" style="margin-left: 1rem;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <div class="profile-info glass-card">
            <div class="profile-avatar-placeholder" id="userAvatarPlaceholder">U</div>
            <img src="" alt="Avatar" class="profile-avatar-img" id="userAvatarImg">

            <div style="flex-grow: 1;">
                <div style="display: flex; justify-content: space-between; align-items: start;">
                    <div>
                        <h2 id="userName" style="margin-bottom: 5px;">Loading...</h2>
                        <p id="userEmail" style="color: var(--light-gray);">Loading...</p>
                    </div>
                    <button onclick="openEditModal()" class="btn-sm btn-secondary">
                        <i class="fas fa-pen"></i> Edit
                    </button>
                </div>

                <div id="userBioDisplay" style="margin-top: 15px; font-style: italic; color: #ccc; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                    </div>
            </div>
        </div>

        <div class="profile-tabs">
            <div class="profile-tab active" data-tab="enrolled">My Learning</div>
            <div class="profile-tab professor-only" data-tab="created" style="display: none;">My Courses</div>
            <div class="profile-tab professor-only" data-tab="students" style="display: none;">Students</div>
            <div class="profile-tab" data-tab="settings">Settings</div>
        </div>

        <div id="enrolledContent" class="profile-content active">
            <h3>My Learning</h3>
            <div id="enrolledCourses" class="course-grid"></div>
        </div>

        <div id="createdContent" class="profile-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3>My Created Courses</h3>
                <a href="/add-course" class="btn"><i class="fas fa-plus"></i> Create New Course</a>
            </div>
            <div id="createdCourses" class="course-grid"></div>
        </div>

        <div id="studentsContent" class="profile-content">
            <h3>My Students</h3>
            <div id="studentsList"></div>
        </div>

        <div id="settingsContent" class="profile-content">
            <h3>Account Settings</h3>
            <p>Password settings coming soon.</p>
        </div>
    </main>

    <div id="editProfileModal" class="modal">
        <div class="glass-card modal-content">
            <span onclick="document.getElementById('editProfileModal').style.display='none'" class="close-modal">&times;</span>
            <h2 style="margin-bottom: 1.5rem;">Edit Profile</h2>
            <form id="editProfileForm">
                <div class="form-group">
                    <label>Avatar Image</label>
                    <input type="file" name="avatar" accept="image/*" class="form-control" style="padding: 10px;">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" id="editUsername" required class="form-control">
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea name="bio" id="editBio" class="form-control" rows="4" placeholder="Tell us about yourself"></textarea>
                </div>
                <button type="submit" class="btn glow-btn" style="width: 100%;">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        let currentUserRole = 'student';
        let currentUserEmail = ''; // Сохраним email для формы
        let currentBio = '';

        // Load user data
        async function loadUserData() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();
                const user = data.user;

                if (user) {
                    currentUserRole = user.role || 'student';
                    currentUserEmail = user.email;
                    currentBio = user.bio || '';

                    // 1. Заполняем текстовые данные
                    document.getElementById('userName').textContent = user.username;

                    const roleLabel = currentUserRole === 'professor'
                        ? ' <span style="background:var(--primary-purple); font-size:0.7em; padding:2px 6px; border-radius:4px;">Professor</span>'
                        : ' <span style="background:gray; font-size:0.7em; padding:2px 6px; border-radius:4px;">Student</span>';

                    document.getElementById('userEmail').innerHTML = user.email + roleLabel;

                    if (user.bio) {
                        document.getElementById('userBioDisplay').textContent = user.bio;
                    } else {
                        document.getElementById('userBioDisplay').textContent = "No bio provided yet.";
                    }

                    // 2. Логика Аватарки
                    const placeholder = document.getElementById('userAvatarPlaceholder');
                    const img = document.getElementById('userAvatarImg');

                    if (user.avatar) {
                        img.src = user.avatar;
                        img.style.display = 'block';
                        placeholder.style.display = 'none';
                    } else {
                        placeholder.textContent = user.username.charAt(0).toUpperCase();
                        placeholder.style.display = 'flex';
                        img.style.display = 'none';
                    }

                    // 3. UI для профессора
                    if (currentUserRole === 'professor') {
                        const btn = document.getElementById('professorActionBtn');
                        if (btn) btn.style.display = 'inline-flex';
                        document.querySelectorAll('.professor-only').forEach(el => {
                            el.style.display = 'block';
                        });
                    }
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }

        // --- ФУНКЦИИ МОДАЛЬНОГО ОКНА ---
        function openEditModal() {
            // Предзаполняем поля текущими значениями
            document.getElementById('editUsername').value = document.getElementById('userName').textContent;
            document.getElementById('editBio').value = currentBio;

            document.getElementById('editProfileModal').style.display = 'block';
        }

        // Закрытие по клику вне окна
        window.onclick = function(event) {
            const modal = document.getElementById('editProfileModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Отправка формы редактирования
        document.getElementById('editProfileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            // Добавляем email (серверу он нужен для идентификации или обновления)
            formData.append('email', currentUserEmail);

            try {
                const res = await fetch('/api/auth/update-profile', {
                    method: 'POST',
                    body: formData // Content-Type ставится автоматически
                });

                if (res.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to update profile');
                }
            } catch (err) {
                console.error(err);
                alert('Error updating profile');
            }
        });


        // --- ЛОГИКА ТАБОВ ---
        document.querySelector('.profile-tabs').addEventListener('click', (e) => {
            if (e.target.classList.contains('profile-tab')) {
                const tab = e.target;
                const tabId = tab.dataset.tab;

                document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.profile-content').forEach(c => c.classList.remove('active'));

                tab.classList.add('active');
                const content = document.getElementById(tabId + 'Content');
                if (content) content.classList.add('active');

                if (tabId === 'enrolled') loadEnrolledCourses();
                else if (tabId === 'created') loadCreatedCourses();
                else if (tabId === 'students') loadStudents();
            }
        });

        // Load courses logic...
        async function loadEnrolledCourses() {
            try {
                const response = await fetch('/api/auth/my-courses');
                const data = await response.json();
                const container = document.getElementById('enrolledCourses');

                if (data.courses && data.courses.length > 0) {
                    container.innerHTML = data.courses.map(course => `
                        <div class="course-card glass-card hover-scale">
                            <div class="card-img-top">
                                <img src="${course.image}" alt="${course.title}" style="height: 150px; object-fit: cover;">
                            </div>
                            <div class="card-body">
                                <div class="card-meta">
                                    <span class="category">${course.category}</span>
                                    <span class="rating"><i class="fas fa-star"></i> ${course.rating}</span>
                                </div>
                                <h3 class="course-title">${course.title}</h3>
                                <p class="instructor">By ${course.instructor}</p>
                                <div class="progress-bar" style="margin: 10px 0;">
                                    <div style="background: var(--medium-gray); height: 5px; border-radius: 3px;">
                                        <div style="background: var(--primary-purple); width: ${course.progress || 0}%; height: 100%; border-radius: 3px;"></div>
                                    </div>
                                    <small>Progress: ${course.progress || 0}%</small>
                                </div>
                                <div class="card-footer">
                                    <a href="/item/${course._id}" class="btn-sm" style="width:100%; text-align:center;">Continue Learning</a>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p>You have not enrolled in any courses yet.</p>';
                }
            } catch (error) { console.error('Error:', error); }
        }

        async function loadCreatedCourses() {
            try {
                const response = await fetch('/api/auth/created-courses');
                const data = await response.json();
                const container = document.getElementById('createdCourses');

                if (data.courses && data.courses.length > 0) {
                    container.innerHTML = data.courses.map(course => `
                        <div class="course-card glass-card hover-scale">
                            <div class="card-img-top">
                                <img src="${course.image}" alt="${course.title}" style="height: 150px; object-fit: cover; width: 100%;">
                            </div>
                            <div class="card-body">
                                <h3 class="course-title">${course.title}</h3>
                                <div class="card-footer" style="margin-top: auto;">
                                    <span class="price">$${course.price}</span>
                                    <div style="display: flex; gap: 5px;">
                                        <button class="btn-sm btn-secondary" onclick="editCourse('${course._id}')"><i class="fas fa-edit"></i></button>
                                        <button class="btn-sm" style="background-color: #ef4444; color: white; border: none;" onclick="deleteCourse('${course._id}')"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p>No courses created yet.</p>';
                }
            } catch (error) { console.error('Error:', error); }
        }

        async function loadStudents() {
            try {
                const response = await fetch('/api/auth/my-students');
                if (response.status === 403 || response.status === 401) return;
                const data = await response.json();
                const container = document.getElementById('studentsList');

                if (data.students && data.students.length > 0) {
                    container.innerHTML = `
                        <div style="overflow-x: auto; margin-top: 1rem;">
                            <table style="width: 100%; border-collapse: collapse; min-width: 500px;">
                                <thead>
                                    <tr style="background: rgba(255,255,255,0.05); text-align: left;">
                                        <th style="padding: 12px; border-bottom: 2px solid #444;">Student Name</th>
                                        <th style="padding: 12px; border-bottom: 2px solid #444;">Course</th>
                                        <th style="padding: 12px; border-bottom: 2px solid #444;">Enrolled Date</th>
                                        <th style="padding: 12px; border-bottom: 2px solid #444;">Progress</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.students.map(s => `
                                        <tr style="border-bottom: 1px solid #333;">
                                            <td style="padding: 12px;">
                                                <div style="font-weight: bold;">${s.username}</div>
                                                <div style="font-size: 0.85em; color: #aaa;">${s.email}</div>
                                            </td>
                                            <td style="padding: 12px;">
                                                <span style="background: rgba(138, 43, 226, 0.1); color: var(--primary-purple); padding: 4px 8px; border-radius: 4px; font-size: 0.9em;">
                                                    ${s.courseTitle}
                                                </span>
                                            </td>
                                            <td style="padding: 12px;">
                                                ${new Date(s.enrolledAt).toLocaleDateString()}
                                            </td>
                                            <td style="padding: 12px;">
                                                <div style="display: flex; align-items: center; gap: 10px;">
                                                    <div style="flex-grow: 1; height: 6px; background: #444; border-radius: 3px; width: 60px;">
                                                        <div style="width: ${s.progress}%; height: 100%; background: #00ff88; border-radius: 3px;"></div>
                                                    </div>
                                                    <span style="font-size: 0.9em;">${s.progress}%</span>
                                                </div>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>`;
                } else {
                    container.innerHTML = `<div style="text-align: center; padding: 3rem; color: #aaa;"><p>No students have enrolled yet.</p></div>`;
                }
            } catch (error) { console.error('Error loading students:', error); }
        }

        async function deleteCourse(courseId) {
            if (!confirm('Delete this course?')) return;
            try {
                const response = await fetch(`/api/courses/${courseId}`, { method: 'DELETE' });
                if (response.ok) loadCreatedCourses();
                else alert('Failed to delete');
            } catch (e) { console.error(e); }
        }

        window.editCourse = function(courseId) { window.location.href = `/add-course?edit=${courseId}`; };

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        });

        loadUserData();
        loadEnrolledCourses();
    </script>
</body>
</html>
