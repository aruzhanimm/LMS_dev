<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduSphere LMS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            padding: 2rem;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--medium-gray);
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 1rem;
            cursor: pointer;
            color: var(--light-gray);
            text-decoration: none;
        }
        .auth-tab.active {
            color: var(--primary-purple);
            border-bottom: 2px solid var(--primary-purple);
            margin-bottom: -2px;
        }
        .auth-form {
            display: block; /* Исправлено для гарантии отображения */
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="auth-container glass-card">
            <div class="auth-tabs">
                <a href="/login" class="auth-tab active">Login</a>
                <a href="/register" class="auth-tab">Register</a>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" name="email" required placeholder="name@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" name="password" required placeholder="********">
                    </div>
                </div>

                <button type="submit" class="btn glow-btn" id="loginBtn" style="width: 100%; margin-top: 1rem;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>

                <div id="loginMessage" style="margin-top: 1rem; text-align: center; min-height: 20px;"></div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const msgBox = document.getElementById('loginMessage');
            const btn = document.getElementById('loginBtn');

            // Визуальная индикация загрузки
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;
            msgBox.textContent = '';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    msgBox.textContent = 'Success! Redirecting...';
                    msgBox.style.color = '#00ff88';

                    // --- ГЛАВНАЯ ЛОГИКА ---
                    // Сервер возвращает requiresRole: true, если роль еще не выбрана
                    if (data.requiresRole) {
                        window.location.href = '/choose-role';
                    } else {
                        // Если роль есть, идем в профиль
                        window.location.href = '/profile';
                    }
                } else {
                    msgBox.textContent = data.error || 'Invalid credentials';
                    msgBox.style.color = '#ff6b6b';
                    btn.innerHTML = originalBtnText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Login error:', error);
                msgBox.textContent = 'Network error. Check console.';
                msgBox.style.color = '#ff6b6b';
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
