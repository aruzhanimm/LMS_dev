<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details - EduSphere LMS</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main class="container">
        <div class="item-detail">
            <div class="item-header">
                <h1 id="course-title">Loading...</h1>
                <div class="item-meta">
                    <span id="meta-rating"><i class="fas fa-star" style="color: gold;"></i> 0.0/5.0</span> |
                    <span id="meta-duration"><i class="fas fa-clock"></i> 0 hours</span> |
                    <span id="meta-students"><i class="fas fa-users"></i> 0 students</span> |
                    <span id="meta-level" style="color: var(--primary-purple); font-weight: bold;"></span>
                </div>
            </div>

            <div style="margin: 2rem 0;">
                <img id="course-image" src="/images/placeholder.jpg" alt="Course Image" style="width: 100%; height: 300px; object-fit: cover; border-radius: 10px;">
            </div>

            <h2>Course Description</h2>
            <p id="course-description" style="white-space: pre-wrap; line-height: 1.6; color: #333;">
                Loading description...
            </p>

            <h2 style="margin-top: 2rem;">Instructor</h2>
            <div style="display: flex; align-items: center; gap: 1rem; margin-top: 1rem;">
                <div style="width: 60px; height: 60px; background: var(--primary-purple); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white;">
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <div>
                    <h3 id="instructor-name">Instructor Name</h3>
                    <p id="instructor-category" style="color: gray;">Instructor</p>
                </div>
            </div>

            <div style="margin-top: 3rem; text-align: center;">
                <a href="#" id="enroll-btn" class="btn" style="padding: 1rem 3rem;">
                    <i class="fas fa-user-plus"></i> Enroll Now <span id="course-price"></span>
                </a>
                <a href="/search?q=courses" class="btn btn-secondary" style="margin-left: 1rem;">
                    Browse More Courses
                </a>
            </div>
        </div>
    </main>

    <script>
    async function loadCourse() {
        // Получаем ID курса из URL (например, /item/65b2f...)
        const pathParts = window.location.pathname.split('/');
        const courseId = pathParts[pathParts.length - 1];

        try {
            const response = await fetch(`/api/courses/${courseId}`);

            if (!response.ok) {
                document.querySelector('.container').innerHTML = '<h2>Course not found</h2>';
                return;
            }

            const course = await response.json();

            // 1. Заполняем Заголовок
            document.getElementById('course-title').textContent = course.title;

            // 2. Заполняем Мета-данные (рейтинг, время, студенты)
            document.getElementById('meta-rating').innerHTML =
                `<i class="fas fa-star" style="color: gold;"></i> ${course.rating || 4.8}/5.0`;

            document.getElementById('meta-duration').innerHTML =
                `<i class="fas fa-clock"></i> ${course.duration || 'N/A'}`;

            document.getElementById('meta-students').innerHTML =
                `<i class="fas fa-users"></i> ${course.enrolledCount || 0} students`;

            document.getElementById('meta-level').textContent = course.level || '';

            // 3. Заполняем Картинку
            const imgElement = document.getElementById('course-image');
            imgElement.src = course.image || '/images/placeholder.jpg';
            imgElement.alt = course.title;

            // 4. Заполняем Описание (Самое важное!)
            // Используем textContent для безопасности
            document.getElementById('course-description').textContent = course.description;

            // 5. Заполняем Инструктора и Цену
            document.getElementById('instructor-name').textContent = course.instructor;
            document.getElementById('instructor-category').textContent = 'Category: ' + course.category;

            const priceText = course.price > 0 ? `($${course.price})` : '(Free)';
            document.getElementById('course-price').textContent = priceText;

            // 6. Настраиваем кнопку записи
            const enrollBtn = document.getElementById('enroll-btn');

            // Проверяем, залогинен ли пользователь, чтобы скрыть кнопку или изменить действие
            const authResponse = await fetch('/api/auth/me');
            if (authResponse.ok) {
                const { user } = await authResponse.json();

                // Проверяем, записан ли уже студент (нужен доп запрос, но пока упростим)
                enrollBtn.onclick = (e) => {
                    e.preventDefault();
                    enrollInCourse(courseId);
                };
            } else {
                // Если не залогинен -> на страницу входа
                enrollBtn.href = '/login';
            }

        } catch (error) {
            console.error('Error loading course:', error);
            document.querySelector('.container').innerHTML = '<h2>Error loading course details</h2>';
        }
    }

    async function enrollInCourse(courseId) {
        try {
            const response = await fetch(`/api/courses/${courseId}/enroll`, {
                method: 'POST'
            });

            const data = await response.json();

            if (response.ok) {
                alert('Successfully enrolled in the course!');
                window.location.reload(); // Перезагрузить страницу, чтобы обновить счетчик
            } else {
                if (response.status === 401) {
                    window.location.href = '/login';
                } else {
                    alert(data.error || 'Failed to enroll');
                }
            }
        } catch (error) {
            console.error('Error enrolling:', error);
            alert('An error occurred. Please try again.');
        }
    }


    loadCourse();
    </script>
</body>
</html>
